[tools]
helm = "4.2.3"
helmfile = "1.7.1"
kubectl = "1.36.2"
jq = "1.7.1"           # secrets:show decodes Secret data with it
prettier = "3.5.3"

[env]
KUBECONFIG = "/Users/dhlee/Workspace/00_ENV/k8s/homelab.kubeconfig"

# up / down take `--stack <name>` (comma-separated for several) and `--env <name>`
# (maps to `helmfile -e <name>` → environments/<name>.yaml, default `homelab`).
#
# Tiers (docs/architecture/stacks.md):
#   0  platform, observability  — always on, owns every CRD
#   1  core                     — always on, holds state
#   2  workloads/*              — toggled
#
# up sorts the stacks it is given into tier order and refuses a tier-2 stack when its
# tiers (platform, core) are neither already up nor part of the same command. A "demo"
# is just a combination: `mise run up --stack core,orchestration,compute`.

[tasks."format:docs"]
description = "Format markdown (unwrap prose, normalize tables/lists)"
run = 'prettier --write --ignore-path .prettierignore "**/*.md" "work/**/*.md"'

[tasks.bootstrap]
description = "Install the helm-diff plugin (helmfile apply/diff need it). Run once per machine"
# A failed plugin install leaves the directory behind with no binary, and helmfile then
# dies mid-apply with "fork/exec ...: no such file or directory". Probe by running the
# plugin, reinstall when the probe fails. --verify=false: Helm 4 checks plugin provenance
# by default and helm-diff publishes none.
run = '''
set -u
if helm diff --help >/dev/null 2>&1; then
  echo "helm-diff ok"
else
  echo "helm-diff missing or broken — reinstalling"
  helm plugin uninstall diff >/dev/null 2>&1 || true
  helm plugin install https://github.com/databus23/helm-diff --verify=false
fi
'''

[tasks.up]
description = "Apply stack(s). --stack core or --stack core,orchestration,compute"
usage = '''
flag "-s --stack <stack>" help="stack(s) to apply, comma-separated (platform, core, orchestration, ...)"
flag "-e --env <env>" help="helmfile environment (default: homelab)"
'''
# Tiers are ordered: platform → observability → core → tier-2. Whatever stacks are
# passed get sorted into this order, so `--stack orchestration,core,platform` still
# comes up correctly. A tier-2 stack refuses to apply unless platform+core are up (or
# named in the same command) — the check saves a cryptic "namespace not found" later.
run = '''
set -eu
env="${usage_env:-homelab}"
order="platform observability core orchestration compute stream ml governance"
req=$(echo "${usage_stack:?set --stack (comma-separated: platform, core, orchestration, ...)}" | tr ',' ' ')

for r in $req; do
  case " $order " in *" $r "*) ;; *) echo "unknown stack: $r" >&2; exit 1 ;; esac
done
in_req() { case " $req " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

# apply in tier order
for s in $order; do
  in_req "$s" || continue

  f="stacks/$s/helmfile.yaml"
  [ -f "$f" ] || f="stacks/workloads/$s/helmfile.yaml"
  [ -f "$f" ] || { echo "no helmfile for stack '$s' — see docs/architecture/stacks.md" >&2; exit 1; }

  # tier-0 (platform) must be up for everything else; tier-1 (core) for tier-2 that
  # depends on the lakehouse (stream is exempt — no hard dep on core).
  if [ "$s" != platform ]; then
    in_req platform || kubectl get crd clusters.postgresql.cnpg.io >/dev/null 2>&1 || {
      echo "platform (tier 0) is not up — run 'mise run up --stack platform' first" >&2; exit 1; }
  fi
  case "$s" in
    orchestration|compute|ml|governance)
      in_req core || kubectl get clusters.postgresql.cnpg.io postgres -n core >/dev/null 2>&1 || {
        echo "core (tier 1) is not up — run 'mise run up --stack core' first" >&2; exit 1; }
      ;;
  esac

  echo "── up: $s"
  case "$s" in
    platform)
      # cert-manager first, alone: the Flink operator manifest references its CRDs
      # (Certificate, Issuer), so the full diff fails until those exist in the cluster.
      helmfile -f "$f" -e "$env" -l name=cert-manager apply
      helmfile -f "$f" -e "$env" apply
      ;;
    core|orchestration)
      # These namespaces adopt the postgres-app / minio-root / airflow-* Secrets, which
      # must exist before the charts install. secrets:sync is idempotent.
      mise run secrets:sync
      helmfile -f "$f" -e "$env" apply
      ;;
    *)
      helmfile -f "$f" -e "$env" apply
      ;;
  esac
done
'''

[tasks.down]
description = "Destroy stack(s) (helmfile destroy). --stack all = every tier-2 stack, reverse order"
usage = '''
flag "-s --stack <stack>" help="stack(s) to destroy, comma-separated, or 'all' for every tier-2 stack"
flag "-e --env <env>" help="helmfile environment (default: homelab)"
flag "--purge" help="Also delete the namespace — this deletes PVCs (MinIO objects, the Postgres PVC)"
'''
# `core` holds the lakehouse and `platform` owns every operator CRD; nothing here backs
# them up, so `all` never touches them — name them explicitly to tear them down.
# Destroys in reverse tier order so dependents go before what they depend on.
run = '''
set -eu
env="${usage_env:-homelab}"
purge="${usage_purge:-}"
order="platform observability core orchestration compute stream ml governance"

if [ "${usage_stack:?set --stack (a name, comma-separated, or 'all')}" = all ]; then
  req="orchestration compute stream ml governance"
else
  req=$(echo "$usage_stack" | tr ',' ' ')
  for r in $req; do
    case " $order " in *" $r "*) ;; *) echo "unknown stack: $r" >&2; exit 1 ;; esac
  done
fi
in_req() { case " $req " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

# reverse tier order
rev=""; for s in $order; do rev="$s $rev"; done
for s in $rev; do
  in_req "$s" || continue
  f="stacks/$s/helmfile.yaml"
  [ -f "$f" ] || f="stacks/workloads/$s/helmfile.yaml"
  [ -f "$f" ] || { echo "no helmfile for stack '$s' — skipping" >&2; continue; }
  echo "── down: $s"
  helmfile -f "$f" -e "$env" destroy
  [ "$purge" = "true" ] && kubectl delete namespace "$s" --ignore-not-found
done
'''

[tasks.diff]
description = "Show what would change across all stacks, without applying (run before up)"
usage = 'flag "-e --env <env>" help="helmfile environment (default: homelab)"'
run = 'helmfile -f helmfile.yaml -e "${usage_env:-homelab}" diff'

[tasks.template]
description = "Render every stack locally — catches chart and values errors with no cluster"
usage = 'flag "-e --env <env>" help="helmfile environment (default: homelab)"'
# No --skip-deps: it also skips the `helm repo add` implied by each stack's
# `repositories:`, so a repo this machine has never seen fails with "repo not found".
run = 'helmfile -f helmfile.yaml -e "${usage_env:-homelab}" template'

[tasks."secrets:sync"]
description = "Create cluster Secrets from .env (up runs it first for core / orchestration)"
# The one place credentials enter the cluster. Reads .env (never committed) and writes
# Secrets the charts adopt by name: CNPG via initdb.secret.name, MinIO via existingSecret,
# Airflow's create-user job via env. No password lands in git or in rendered YAML.
run = '''
set -eu
cd "$(git rev-parse --show-toplevel)"
[ -f .env ] || { echo "no .env — copy .env.example to .env and fill it in" >&2; exit 1; }
set -a; . ./.env; set +a

: "${POSTGRES_APP_PASSWORD:?set in .env}"
: "${MINIO_ROOT_USER:?set in .env}"         "${MINIO_ROOT_PASSWORD:?set in .env}"
: "${AIRFLOW_ADMIN_USERNAME:?set in .env}"  "${AIRFLOW_ADMIN_PASSWORD:?set in .env}"
: "${AIRFLOW_VIEWER_USERNAME:?set in .env}" "${AIRFLOW_VIEWER_PASSWORD:?set in .env}"

# The PostgreSQL username must equal the database owner CNPG creates (initdb.owner: app),
# so it is fixed here rather than read from .env — a mismatch bootstraps a role no one can
# log in as.
POSTGRES_APP_USER=app

# apply, not create: a running CNPG operator owns postgres-app and recreates it within a
# second, so `create` fails "already exists". A Secret's type is immutable, so it must be
# set to match what already exists (postgres-app is basic-auth everywhere).
sync_secret() {  # ns name secret-type key=val...
  ns="$1"; name="$2"; stype="$3"; shift 3
  kubectl get namespace "$ns" >/dev/null 2>&1 || {
    echo "namespace '$ns' missing — run 'mise run up --stack platform' first" >&2; exit 1; }
  args=""
  for kv in "$@"; do args="$args --from-literal=$kv"; done
  kubectl create secret generic "$name" -n "$ns" --type="$stype" $args \
    --dry-run=client -o yaml | kubectl apply -f - >/dev/null
  echo "  $ns/$name"
}

for ns in core orchestration; do
  sync_secret "$ns" postgres-app kubernetes.io/basic-auth \
    "username=$POSTGRES_APP_USER" "password=$POSTGRES_APP_PASSWORD"
  sync_secret "$ns" minio-root Opaque \
    "rootUser=$MINIO_ROOT_USER" "rootPassword=$MINIO_ROOT_PASSWORD"
done

sync_secret orchestration airflow-admin Opaque \
  "username=$AIRFLOW_ADMIN_USERNAME" "password=$AIRFLOW_ADMIN_PASSWORD"
sync_secret orchestration airflow-viewer Opaque \
  "username=$AIRFLOW_VIEWER_USERNAME" "password=$AIRFLOW_VIEWER_PASSWORD"

echo "synced."
'''

[tasks."secrets:show"]
description = "Print the credentials in a cluster Secret (they live only in the cluster)"
usage = '''
arg "<name>" help="secret name, e.g. postgres-app, minio-root, airflow-admin"
flag "-n --namespace <namespace>" help="namespace holding the secret (default: core)"
'''
# jq, not `-o go-template`: mise renders task scripts as templates first, so a go-template's
# {{ }} is eaten before kubectl runs and it fails with "Unexpected character".
run = '''
kubectl get secret "${usage_name}" -n "${usage_namespace:-core}" -o json \
  | jq -r '.data | to_entries[] | "\(.key): \(.value|@base64d)"'
'''

[tasks.status]
description = "Show helm releases, pods, quota usage and node memory"
run = '''
echo "── releases ─────────────────────────────────────────"
helm list -A
echo
echo "── pods ─────────────────────────────────────────────"
kubectl get pods -A --sort-by=.metadata.namespace
echo
echo "── quota ────────────────────────────────────────────"
kubectl get resourcequota -A
echo
echo "── node ─────────────────────────────────────────────"
kubectl top node
'''
