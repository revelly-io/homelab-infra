# Template for a k8s deployment target. Copy to environments/<env>.yaml (gitignored
# or kept in a private fork) and edit for your cluster.
#
# Everything here is a fact about one cluster. How a fact gets wired into a chart
# belongs in stacks/*/values/, not here.
#
# <env> must match data-platform --env.

env: dev

cluster:
  storageClass: local-path

ingress:
  className: traefik
  hostSuffix: dev.example.com

# External hostnames, reached through the ingress.
domains:
  airflow: airflow-dev.example.com
  minioApi: minio-dev.example.com
  minioConsole: minio-console-dev.example.com

# In-cluster addresses. Fixed by the stack layout — namespace `core`, and
# `fullnameOverride: postgres` in the CNPG values. Listed here so no values file
# hardcodes them: the same address is needed by Polaris, Airflow and later MLflow,
# and three copies of a string is three chances to miss one when it changes.
endpoints:
  postgres: postgres-rw.core.svc.cluster.local
  postgresPort: 5432
  minioApi: http://minio.core.svc.cluster.local:9000

# Three buckets, split by lifecycle so log churn cannot fill the disk out from
# under the warehouse. Named in full rather than derived from one prefix — the
# suffix rule would otherwise be repeated in every values file that references a
# bucket, and a one-sided edit fails silently at runtime.
#
# warehouse must match data-platform's `datasets.warehouse` (s3a://<name>).
minio:
  warehouseBucket: dev
  logsBucket: dev-logs
  artifactsBucket: dev-artifacts

sizing:
  core:
    minioPvc: 100Gi
    postgresStorage: 20Gi

airflow:
  gitSync:
    repo: https://github.com/revelly-io/data-platform.git
    branch: main
    subPath: ""

# One CNPG cluster in `core` serves every stack. Databases are declared up front so
# bringing up a tier-2 stack never requires touching core again.
postgres:
  databases:
    - polaris
    - airflow
    - mlflow
    - superset
    - openmetadata
